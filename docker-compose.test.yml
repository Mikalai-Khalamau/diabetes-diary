services:
  db-test:
    image: postgres:16
    container_name: diabetes-pg-test
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: diary_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d diary_test"]
      interval: 3s
      timeout: 3s
      retries: 10