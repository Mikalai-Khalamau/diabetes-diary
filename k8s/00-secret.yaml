apiVersion: v1
kind: Secret
metadata:
  name: diabetes-secrets
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
  POSTGRES_DB: diary
  DATABASE_URL: postgresql+psycopg2://app:app@diabetes-db:5432/diary
  SECRET_KEY: minikube-demo-secret-key-change-me-1234567890
  POSTGRES_EXPORTER_DSN: postgresql://app:app@localhost:5432/diary?sslmode=disable
