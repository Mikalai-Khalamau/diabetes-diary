apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: default
data:
  fluent-bit.conf: |
    [SERVICE]
    Flush 1
    Log_Level info
    Parsers_File parsers.conf

    [INPUT]
    Name tail
    Path /var/log/containers/*diabetes-app*.log
    Parser docker
    Tag kube.*
    Refresh_Interval 5
    Skip_Long_Lines On
    Mem_Buf_Limit 5MB

    [FILTER]
    Name parser
    Match kube.*
    Key_Name log
    Parser json_app
    Reserve_Data On
    Preserve_Key Off

    [FILTER]
    Name kubernetes
    Match kube.*
    Merge_Log Off
    K8S-Logging.Parser Off
    K8S-Logging.Exclude Off
    Labels Off
    Annotations Off

    [FILTER]
    Name modify
    Match kube.*
    Rename message _msg

    [FILTER]
    Name modify
    Match kube.*
    Condition Key_does_not_exist _msg
    Rename log _msg

    [OUTPUT]
    Name http
    Match kube.*
    Host vl-victoria-logs-single-server
    Port 9428
    URI /insert/jsonline?_stream_fields=stream,kubernetes.pod_name,kubernetes.container_name&_msg_field=_msg&_time_field=_time
    Format json_lines
    json_date_key _time
    json_date_format iso8601

  parsers.conf: |
    [PARSER]
    Name docker
    Format json
    Time_Key time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep On

    [PARSER]
    Name json_app
    Format json