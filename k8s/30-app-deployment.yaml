apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diabetes-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: diabetes-app
    spec:
      containers:
        - name: app
          image: diabetes-app:minikube
          imagePullPolicy: IfNotPresent
          command:
            - python
            - run.py
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: diabetes-config
            - secretRef:
                name: diabetes-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi