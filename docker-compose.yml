services:
  db:
    image: postgres:16
    container_name: diabetes-pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: diary
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d diary"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: diabetes-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        python -m scripts.seed &&
        python run.py
      "

volumes:
  pgdata: